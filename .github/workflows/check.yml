name: compiler checks
on: [push, pull_request]
jobs:
  acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [desktop, offscreen, cli-only]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install external execution tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-user xvfb libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Install optional workbench
        if: matrix.environment != 'cli-only'
        run: python -m pip install -r requirements.txt
      - name: Full acceptance with desktop
        if: matrix.environment == 'desktop'
        run: xvfb-run -a python -m tools.check --full
      - name: Full acceptance without desktop
        if: matrix.environment != 'desktop'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m tools.check --full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.environment }}
          path: build/
