[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mycc"
version = "0.1.0"
description = "Capability-driven C subset compiler for RV32IM"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6==6.8.3"]
test = ["pytest>=8,<10", "coverage>=7,<8"]

[project.scripts]
mycc = "mycc.cli:main"

[tool.setuptools.packages.find]
include = ["mycc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
